<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>RAV Praise Team</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f7;background:#0c1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.shell{min-height:100dvh;display:flex}.sidebar{width:235px;background:#101a2a;border-right:1px solid #27364a;padding:25px 15px;display:flex;flex-direction:column;gap:8px}.brand{font-size:21px;font-weight:850;color:#fff;margin:0 8px 25px}.brand span{color:#e9b967}.nav{background:transparent;border:0;color:#aebed2;padding:14px 16px;border-radius:12px;text-align:left}.nav.active,.nav:hover{background:#20364d;color:white}.nav-bottom{margin-top:auto}.main{flex:1;min-width:0;padding:30px;max-width:1300px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.top h1{margin:0;font-size:28px}.muted{color:#a3b2c6}.small{font-size:12px}.pill{border:1px solid #35546a;border-radius:30px;padding:6px 12px;color:#a9d8c7;font-size:12px}.panel{background:#152236;border:1px solid #2b3b51;border-radius:17px;padding:20px;margin-bottom:18px}.panel h2{margin:0 0 14px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#1b2b40;border:1px solid #33455b;border-radius:14px;padding:17px}.card h3{margin:0 0 7px}.btn{background:#e9b967;border:0;color:#152033;font-weight:750;border-radius:10px;padding:11px 15px}.btn.secondary{background:#293e54;color:#f1f6fc}.btn.danger{background:#623039;color:#fff}.btn.outline{background:transparent;border:1px solid #587087;color:#eaf0f7}.btn.sm{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:#c4d2e2}.field input,.field textarea,.field select,input.search{width:100%;background:#0e1929;border:1px solid #3a4d63;border-radius:10px;color:white;padding:11px;outline-offset:2px}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#e9b967}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:12px}.listitem{border:1px solid #34495e;border-radius:12px;padding:13px;background:#1b2b40}.listitem.selected{border-color:#e9b967}.tag{font-size:12px;color:#f6d69a}.song-title{font-size:17px;font-weight:750}.empty{padding:25px;color:#aab9c8;text-align:center}.setlist-screen{background:#000;color:#fff;border:1px solid #353535;border-radius:16px;padding:20px;min-height:400px}.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:16px 0}.section{background:#101010;border:1px solid #484848;color:#fff;border-radius:10px;text-align:left;padding:13px;min-height:95px;white-space:pre-line}.section.active{border:2px solid #e9b967;background:#25211a}.section .name{font-weight:800;margin-bottom:8px}.section .preview{font-size:12px;color:#eee;line-height:1.4}.stage{background:#000;border:1px solid #333;border-radius:12px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:16px}.stage .lyrics{white-space:pre-line;font-size:clamp(23px,3vw,37px);font-weight:650;line-height:1.45}.stage .chords{white-space:pre-wrap;font-size:clamp(16px,2vw,24px);font-weight:750}.stage .sectlabel{font-size:13px;letter-spacing:2px;font-weight:800}.stage.monitor{min-height:65vh}.color-row{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #667;cursor:pointer}.swatch.selected{outline:2px solid white;outline-offset:2px}.auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#243d5a,#0c1220 65%)}.auth-card{width:min(430px,100%);background:#142239;border:1px solid #324a64;border-radius:22px;padding:30px}.auth-logo{width:75px;height:75px;border-radius:20px;background:linear-gradient(135deg,#264d7b,#101a2a);display:grid;place-items:center;font-size:29px;font-weight:900;color:#e9b967;margin:auto auto 15px}.auth-card h1{text-align:center;margin:0}.auth-card p{text-align:center}.auth-card .btn{width:100%}.notice{padding:12px;background:#24374b;border-radius:10px;font-size:13px}.warning{color:#f2c6b7}.split{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,1.5fr);gap:16px}.line{height:1px;background:#304155;margin:14px 0}.topright{display:flex;gap:8px;align-items:center}.mobile-nav{display:none}.chatlog{height:310px;overflow:auto;background:#101b2b;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;background:#263d56;border-radius:12px;padding:10px 13px;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#2e5268}.bubble b{display:block;font-size:12px;color:#e9b967;margin-bottom:5px}.section-editor{background:#101c2e;border-radius:12px;padding:12px;margin-bottom:10px}.section-editor .row{align-items:flex-start}.section-editor textarea{min-height:75px}.color-input{height:42px!important;padding:3px!important}.inline{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.inline .field{flex:1;min-width:120px}.nowrap{white-space:nowrap}@media(max-width:760px){.sidebar{display:none}.main{padding:17px 14px 85px}.top h1{font-size:22px}.mobile-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;background:#111c2d;border-top:1px solid #314359;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{flex:1;background:none;border:0;color:#9fb0c4;font-size:11px;padding:9px 1px}.mobile-nav button.active{color:#e9b967}.split{grid-template-columns:1fr}.section-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:15px}.stage .lyrics{font-size:24px}} </style></head><body>
<div id="auth" class="auth"><div class="auth-card"><div class="auth-logo">RAV</div><h1>RAV <span style="color:#e9b967">Praise Team</span></h1><p class="muted">Acceso privado · RÍOS DE AGUA VIVA</p><div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" placeholder="tu@correo.com"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"></div><button class="btn" id="loginBtn">Iniciar sesión</button><p id="authError" class="warning small"></p><div class="notice">Acceso exclusivo para integrantes autorizados. Los datos compartidos se consultan en Supabase.</div></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">RAV <span>Praise Team</span></div><button class="nav active" data-tab="home">⌂ &nbsp; Inicio</button><button class="nav" data-tab="songs">♫ &nbsp; Cantos</button><button class="nav" data-tab="setlists">▤ &nbsp; Playlists</button><button class="nav" data-tab="stage">▣ &nbsp; Setlist en vivo</button><button class="nav" data-tab="chat">☏ &nbsp; Chat</button><button class="nav nav-bottom" data-tab="account">◉ &nbsp; Cuenta</button></aside><main class="main"><div class="top"><h1 id="pageTitle">Inicio</h1><div class="topright"><span id="roleBadge" class="pill">Monitor</span><button id="logoutTop" class="btn secondary sm">Salir</button></div></div><div id="page"></div></main><nav class="mobile-nav"><button data-tab="home">Inicio</button><button data-tab="songs">Cantos</button><button data-tab="setlists">Playlists</button><button data-tab="stage">Setlist</button><button data-tab="chat">Chat</button><button data-tab="account">Cuenta</button></nav></div>
<script>
'use strict';
// CONFIGURA ESTOS DOS VALORES CON LOS DE TU PROYECTO EXISTENTE.
// La clave ANON/PUBLISHABLE es pública por diseño. NUNCA coloques aquí service_role ni claves secretas.
const SUPABASE_URL='';
const SUPABASE_ANON_KEY='';
const LOCAL_PREFIX='ravpt_v2_';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const sampleSections=()=>[{id:uid(),type:'Intro',lyrics:'Instrumental',chords:'G D Em C',color:'#ffffff'},{id:uid(),type:'Estrofa 1',lyrics:'',chords:'',color:'#ffffff'},{id:uid(),type:'Coro',lyrics:'',chords:'',color:'#ffffff'}];
let syncing=false,session=null,role='monitor',tab='home',songs=[],playlists=[],chat=[],activePlaylist=null,activeSong=null,activeSection=0,stageKey='G',editSongId=null,editPlaylistId=null,leaderMode=false,monitorOnly=false;
const KEYS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const norm={Db:'C#','D#':'Eb',Gb:'F#','G#':'Ab','A#':'Bb'};
function transpose(text,from,to){let diff=KEYS.indexOf(to)-KEYS.indexOf(from);if(!Number.isFinite(diff))return text;return String(text).replace(/(^|[\s|/()])([A-G](?:#|b)?)(m(?:aj|in)?\d*|sus\d*|add\d*|dim|aug|7|9|11|13|m)?(?=$|[\s|/()])/g,(all,pre,root,suf)=>{let n=KEYS.indexOf(norm[root]||root);return n<0?all:pre+KEYS[(n+diff+12)%12]+(suf||'')})}
function store(k,v){localStorage.setItem(LOCAL_PREFIX+k,JSON.stringify(v))}function load(k,def){try{return JSON.parse(localStorage.getItem(LOCAL_PREFIX+k))??def}catch{return def}}

function assertConfigured(){if(!/^https:\/\/[^/]+\.supabase\.co$/.test(SUPABASE_URL.replace(/\/$/,''))||!SUPABASE_ANON_KEY)throw Error('Configura SUPABASE_URL y SUPABASE_ANON_KEY en index.html.')}
async function token(){if(!session?.access_token)throw Error('Inicia sesión de nuevo.');if(session.expires_at&&Date.now()/1000>session.expires_at-90){const fresh=await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});session={...fresh,expires_at:Math.floor(Date.now()/1000)+fresh.expires_in};role=fresh.user?.app_metadata?.role==='leader'?'leader':'monitor';store('session',session)}return session.access_token}
async function db(table,method='GET',query='',body){return request('/rest/v1/'+table+query,method,body,await token())}
function unpackSections(body){if(!body)return sampleSections();try{const a=JSON.parse(body);if(Array.isArray(a))return a;if(Array.isArray(a.sections))return a.sections}catch{}return [{id:uid(),type:'Letra y acordes',lyrics:body,chords:'',color:'#ffffff'}]}
function dbSong(x){return {id:x.id,title:x.title||'',author:x.author||'',key:x.key||'G',sections:unpackSections(x.body)}}
function dbPlaylist(x,entries){return {id:x.id,name:x.name||('Servicio '+x.service_date),date:x.service_date||'',status:x.status==='ready'?'Lista':x.status==='completed'?'Finalizada':'En preparación',items:entries.filter(z=>z.setlist_id===x.id).sort((a,b)=>a.position-b.position).map(z=>({songId:z.song_id,key:z.song_key||songs.find(t=>t.id===z.song_id)?.key||'G'}))}}
async function refreshData(){assertConfigured();const [ss,pp,entries]=await Promise.all([db('songs','GET','?select=id,title,author,key,body,updated_at&order=title.asc'),db('setlists','GET','?select=id,service_date,name,status,updated_at&order=service_date.asc'),db('setlist_songs','GET','?select=id,setlist_id,song_id,position,song_key&order=position.asc')]);songs=ss.map(dbSong);playlists=pp.map(x=>dbPlaylist(x,entries));if(activePlaylist&&!playlists.some(x=>x.id===activePlaylist)){activePlaylist=null;activeSong=null}render()}
async function guardedSave(fn){if(syncing)return;syncing=true;try{await fn();await refreshData()}catch(e){alert('No se pudo guardar en Supabase: '+e.message);try{await refreshData()}catch{}}finally{syncing=false}}

function dataKey(k){return session?.user?.id+'_'+k}
function loadData(){songs=[];playlists=[];chat=[];activePlaylist=null;activeSong=null;activeSection=0;leaderMode=false}
function persist(){ /* Las canciones y playlists se guardan exclusivamente en Supabase. */ }
function canEdit(){return role==='leader'&&!monitorOnly}function gate(){if(!canEdit()){alert('Solo un líder autorizado puede realizar esta acción.');return false}return true}
async function request(path,method='GET',body,token){const res=await fetch(SUPABASE_URL.replace(/\/$/,'')+path,{method,headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(method!=='GET'?{Prefer:'return=representation'}:{})},body:body===undefined?undefined:JSON.stringify(body)});const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!res.ok)throw Error(data?.message||data?.error_description||data?.msg||('Error '+res.status));return data}
async function login(){try{assertConfigured();const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('Ingresa correo y contraseña.');$('loginBtn').disabled=true;$('authError').textContent='';const a=await request('/auth/v1/token?grant_type=password','POST',{email,password});if(!a.access_token||!a.user)throw Error('No se pudo autenticar');session={...a,expires_at:Math.floor(Date.now()/1000)+a.expires_in};role=a.user.app_metadata?.role==='leader'?'leader':'monitor';store('session',session);loadData();showApp();await refreshData()}catch(e){$('authError').textContent=e.message;if(session)logout()}finally{$('loginBtn').disabled=false}}
async function restore(){if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return;const a=load('session',null);if(!a?.refresh_token)return;try{const b=await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:a.refresh_token});if(!b.access_token||!b.user)return;session={...b,expires_at:Math.floor(Date.now()/1000)+b.expires_in};role=b.user.app_metadata?.role==='leader'?'leader':'monitor';store('session',session);loadData();showApp();await refreshData()}catch(e){logout();$('authError').textContent='Inicia sesión nuevamente: '+e.message}}
function logout(){session=null;role='monitor';songs=[];playlists=[];chat=[];localStorage.removeItem(LOCAL_PREFIX+'session');$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value=''}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');render()}
const names={home:'Inicio',songs:'Cantos',setlists:'Playlists por evento',stage:'Setlist en vivo',chat:'Chat del equipo',account:'Cuenta'};
function switchTab(t){tab=t;editSongId=null;editPlaylistId=null;render()}
function render(){$('pageTitle').textContent=names[tab];$('roleBadge').textContent=role==='leader'?'Líder autorizado':'Monitor';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const views={home:renderHome,songs:renderSongs,setlists:renderPlaylists,stage:renderStage,chat:renderChat,account:renderAccount};$('page').innerHTML=views[tab]();bindPage()}
function renderHome(){let upcoming=[...playlists].filter(p=>p.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(0,3);return `<div class="panel"><h2>Bienvenido a RAV Praise Team</h2><p class="muted">Prepara cantos, organiza eventos y consulta la presentación del equipo.</p><div class="grid"><div class="card"><h3>${songs.length}</h3><div class="muted">Cantos en Supabase</div></div><div class="card"><h3>${playlists.length}</h3><div class="muted">Playlists compartidas</div></div><div class="card"><h3>${esc(role==='leader'?'Líder':'Monitor')}</h3><div class="muted">Tu permiso actual</div></div></div></div><div class="panel"><h2>Próximos eventos</h2>${upcoming.length?upcoming.map(p=>`<div class="listitem row"><div><b>${esc(p.name)}</b><div class="muted small">${esc(p.date)} · ${p.items.length} cantos</div></div><button class="btn secondary sm" data-openplaylist="${esc(p.id)}">Ver</button></div>`).join(''):'<div class="empty">Aún no hay próximos eventos.</div>'}</div><div class="notice">Cantos y playlists sincronizados con Supabase al abrir la aplicación. El control en vivo y el chat compartido todavía no están habilitados.</div>`}
function renderSongs(){if(editSongId!==null)return renderSongEditor();return `<div class="panel"><div class="row"><div><h2>Biblioteca de cantos</h2><p class="muted small">Estrofas independientes, acordes y tono original.</p></div>${canEdit()?'<button class="btn" id="newSong">+ Nuevo canto</button>':''}</div><input class="search" id="songSearch" placeholder="Buscar por título o autor..." style="margin:10px 0 15px"><div id="songResults">${songCards(songs)}</div></div>`}
function songCards(arr){return arr.length?`<div class="grid">${arr.map(s=>`<div class="card"><div class="tag">Tono original: ${esc(s.key)}</div><h3>${esc(s.title)}</h3><div class="muted small">${esc(s.author||'Sin autor')} · ${s.sections.length} secciones</div><div class="actions" style="margin-top:13px"><button class="btn secondary sm" data-view-song="${esc(s.id)}">Ver</button>${canEdit()?`<button class="btn outline sm" data-edit-song="${esc(s.id)}">Editar</button>`:''}</div></div>`).join('')}</div>`:'<div class="empty">No hay cantos todavía.</div>'}
function renderSongEditor(){let s=songs.find(x=>x.id===editSongId)||{id:'',title:'',author:'',key:'G',sections:sampleSections()};return `<div class="panel"><div class="row"><h2>${s.id?'Editar canto':'Nuevo canto'}</h2><button class="btn secondary sm" id="cancelSong">Volver</button></div><div class="grid"><div class="field"><label>Título</label><input id="songTitle" value="${esc(s.title)}"></div><div class="field"><label>Autor</label><input id="songAuthor" value="${esc(s.author)}"></div><div class="field"><label>Tonalidad original</label><select id="songKey">${KEYS.map(k=>`<option ${s.key===k?'selected':''}>${k}</option>`).join('')}</select></div></div><h2>Secciones del canto</h2><p class="muted small">Cada estrofa, coro y puente tendrá su propio espacio. Blanco por defecto.</p><div id="sectionEditors">${s.sections.map((p,i)=>sectionEditor(p,i)).join('')}</div><div class="actions"><button class="btn secondary" id="addSection">+ Agregar sección</button><button class="btn" id="saveSong">Guardar canto</button>${s.id?'<button class="btn danger" id="deleteSong">Eliminar canto</button>':''}</div></div>`}
function sectionEditor(p,i){return `<div class="section-editor" data-section-row="${i}"><div class="row"><b>Sección ${i+1}</b><button class="btn danger sm" data-remove-section="${i}">Quitar</button></div><div class="grid" style="margin-top:10px"><div class="field"><label>Nombre (Estrofa 1, Estrofa 2, Coro...)</label><input class="section-type" value="${esc(p.type)}"></div><div class="field"><label>Color de identificación</label><input type="color" class="section-color color-input" value="${/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#ffffff'}"></div></div><div class="field"><label>Letra</label><textarea class="section-lyrics">${esc(p.lyrics)}</textarea></div><div class="field"><label>Acordes (separados por espacios)</label><input class="section-chords" value="${esc(p.chords)}"></div></div>`}
function collectSections(){return [...document.querySelectorAll('[data-section-row]')].map(x=>({id:uid(),type:x.querySelector('.section-type').value.trim()||'Sección',lyrics:x.querySelector('.section-lyrics').value,chords:x.querySelector('.section-chords').value,color:x.querySelector('.section-color').value}))}
function renderPlaylists(){if(editPlaylistId!==null)return renderPlaylistEditor();return `<div class="panel"><div class="row"><div><h2>Playlists guardadas</h2><p class="muted small">Una playlist diferente para cada servicio, ensayo o evento.</p></div>${canEdit()?'<button class="btn" id="newPlaylist">+ Nuevo evento</button>':''}</div><div class="grid" style="margin-top:16px">${playlists.length?playlists.map(p=>`<div class="card"><div class="tag">${esc(p.date||'Sin fecha')}</div><h3>${esc(p.name)}</h3><p class="muted small">${p.items.length} cantos · ${esc(p.status||'En preparación')}</p><div class="actions"><button class="btn secondary sm" data-openplaylist="${esc(p.id)}">Abrir</button>${canEdit()?`<button class="btn outline sm" data-editplaylist="${esc(p.id)}">Editar</button><button class="btn outline sm" data-duplicate="${esc(p.id)}">Duplicar</button>`:''}</div></div>`).join(''):'<div class="empty">Crea tu primera playlist para un evento.</div>'}</div></div>`}
function renderPlaylistEditor(){let p=playlists.find(x=>x.id===editPlaylistId)||{id:'',name:'',date:'',status:'En preparación',items:[]};return `<div class="panel"><div class="row"><h2>${p.id?'Editar playlist':'Nueva playlist'}</h2><button class="btn secondary sm" id="cancelPlaylist">Volver</button></div><div class="grid"><div class="field"><label>Nombre del evento</label><input id="playlistName" value="${esc(p.name)}" placeholder="Ej. Servicio dominical"></div><div class="field"><label>Fecha</label><input type="date" id="playlistDate" value="${esc(p.date)}"></div><div class="field"><label>Estado</label><select id="playlistStatus">${['En preparación','Lista','Finalizada'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><h2>Cantos en esta playlist</h2><div id="playlistItems">${playlistItemsHtml(p.items)}</div><div class="actions" style="margin-top:15px"><button class="btn secondary" id="addPlaylistSong" ${songs.length?'':'disabled'}>+ Agregar canto</button><button class="btn" id="savePlaylist">Guardar playlist</button>${p.id?'<button class="btn danger" id="deletePlaylist">Eliminar playlist</button>':''}</div></div>`}
function playlistItemsHtml(items){return items.length?items.map((it,i)=>{let s=songs.find(x=>x.id===it.songId);return `<div class="listitem row" data-item-row="${i}"><div style="flex:1"><b>${i+1}. ${esc(s?.title||'Canto eliminado')}</b><div class="muted small">Tono para este evento</div><select class="item-key" style="background:#101b2b;color:white;padding:6px;border-radius:6px">${KEYS.map(k=>`<option ${it.key===k?'selected':''}>${k}</option>`).join('')}</select><input type="hidden" class="item-song" value="${esc(it.songId)}"></div><div class="actions"><button class="btn secondary sm" data-move-up="${i}" ${i===0?'disabled':''}>↑</button><button class="btn secondary sm" data-move-down="${i}" ${i===items.length-1?'disabled':''}>↓</button><button class="btn danger sm" data-remove-item="${i}">×</button></div></div>`}).join(''):'<div class="empty">Esta playlist todavía no tiene cantos.</div>'}
function renderStage(){let p=playlists.find(x=>x.id===activePlaylist),items=p?.items||[],item=items.find(x=>x.songId===activeSong)||items[0],s=songs.find(x=>x.id===item?.songId),sect=s?.sections[activeSection]||s?.sections[0];return `<div class="setlist-screen"><div class="row"><div><b>SETLIST</b><div class="small" style="color:#bbb">Fondo negro · letra blanca</div></div><span class="pill">${leaderMode?'Vista líder local':'Vista monitor / preparación'}</span></div><div class="inline" style="margin-top:20px"><div class="field"><label>Playlist</label><select id="stagePlaylist"><option value="">Selecciona evento</option>${playlists.map(x=>`<option value="${esc(x.id)}" ${x.id===activePlaylist?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Canto</label><select id="stageSong">${items.map(it=>{let song=songs.find(x=>x.id===it.songId);return `<option value="${esc(it.songId)}" ${it.songId===(s?.id||activeSong)?'selected':''}>${esc(song?.title||'Canto eliminado')}</option>`}).join('')}</select></div><div class="field"><label>Tonalidad</label><select id="stageKey">${KEYS.map(k=>`<option ${k===(s?stageKey:'G')?'selected':''}>${k}</option>`).join('')}</select></div></div>${canEdit()?`<div class="actions"><button class="btn secondary sm" id="toggleLeader">${leaderMode?'Salir de vista líder':'Vista líder (solo local)'}</button></div>`:''}${s?`<h2 style="color:white;margin-top:20px">${esc(s.title)}</h2><div class="section-grid">${s.sections.map((part,i)=>`<button class="section ${i===activeSection?'active':''}" data-stage-section="${i}"><div class="name" style="color:${esc(part.color||'#ffffff')}">${esc(part.type)}</div><div class="preview">${esc(part.lyrics.slice(0,90))}</div></button>`).join('')}</div><div class="stage ${monitorOnly?'monitor':''}"><div class="sectlabel" style="color:${esc(sect?.color||'#ffffff')}">${esc(sect?.type||'')}</div><div class="chords">${esc(transpose(sect?.chords||'',s.key,stageKey))}</div><div class="lyrics">${esc(sect?.lyrics||'Instrumental')}</div></div><div class="actions" style="justify-content:center;margin-top:15px"><button class="btn secondary" id="prevSection" ${activeSection===0?'disabled':''}>← Anterior</button><button class="btn secondary" id="nextSection" ${activeSection===s.sections.length-1?'disabled':''}>Siguiente →</button></div>`:'<div class="empty">Elige una playlist con cantos para visualizar las secciones.</div>'}<p class="small" style="color:#999">Vista local de prueba. Todavía NO controla otros dispositivos ni bloquea líderes simultáneos.</p></div>`}
function renderChat(){return `<div class="panel"><h2>Chat privado del equipo</h2><p class="muted small">Chat compartido pendiente de integración. Esta vista todavía es una demostración local.</p><div class="chatlog" id="chatlog">${chat.map(m=>`<div class="bubble mine"><b>${esc(m.name)}</b>${esc(m.text)}<div class="small muted">${esc(m.time)}</div></div>`).join('')}</div><div class="inline" style="margin-top:12px"><div class="field" style="flex:4"><label>Mensaje</label><input id="chatInput" maxlength="500" placeholder="Escribe un mensaje..."></div><button class="btn" id="sendChat" style="margin-bottom:12px">Enviar</button></div></div>`}
function renderAccount(){return `<div class="panel"><h2>Mi cuenta</h2><div class="listitem"><b>Correo</b><p class="muted">${esc(session?.user?.email)}</p><b>Permiso</b><p class="muted">${role==='leader'?'Líder autorizado':'Monitor / lectura'}</p><b>Sesión</b><p class="muted">Sin cierre automático por inactividad. Puedes salir manualmente.</p></div><div class="actions" style="margin-top:15px"><button class="btn secondary" id="logoutAccount">Cerrar sesión</button><button class="btn secondary" id="reloadData">Actualizar datos</button></div></div><div class="panel"><h2>Conexión</h2><p class="muted">Los cantos y las playlists se leen y guardan en Supabase. Chat y vista en vivo son demostraciones locales y todavía no sincronizan con otros dispositivos.</p></div>`}
function bindPage(){document.querySelectorAll('[data-openplaylist]').forEach(b=>b.onclick=()=>{activePlaylist=b.dataset.openplaylist;activeSong=null;activeSection=0;let p=playlists.find(x=>x.id===activePlaylist);let it=p?.items[0];stageKey=it?.key||'G';persist();tab='stage';render()});if(tab==='songs')bindSongs();if(tab==='setlists')bindPlaylists();if(tab==='stage')bindStage();if(tab==='chat'){$('sendChat').disabled=true;$('chatInput').disabled=true;$('chatInput').placeholder='Chat compartido próximamente'}if(tab==='account'){$('logoutAccount').onclick=logout;$('reloadData').onclick=()=>refreshData().catch(e=>alert(e.message))}}
function bindSongs(){if(editSongId===null){if($('newSong'))$('newSong').onclick=()=>{editSongId='';render()};$('songSearch').oninput=e=>{$('songResults').innerHTML=songCards(songs.filter(s=>(s.title+' '+s.author).toLowerCase().includes(e.target.value.toLowerCase())));bindSongCards()};bindSongCards();return}$('cancelSong').onclick=()=>{editSongId=null;render()};$('addSection').onclick=()=>{let box=$('sectionEditors');let i=box.querySelectorAll('[data-section-row]').length;box.insertAdjacentHTML('beforeend',sectionEditor({type:'Estrofa '+(i+1),lyrics:'',chords:'',color:'#ffffff'},i));bindRemoveSections()};bindRemoveSections();$('saveSong').onclick=()=>{if(!gate())return;let title=$('songTitle').value.trim();if(!title)return alert('Escribe el título');let sections=collectSections();if(!sections.length)return alert('Agrega una sección');let id=editSongId||uid();let record={title,author:$('songAuthor').value.trim(),key:$('songKey').value,body:JSON.stringify({sections})};guardedSave(async()=>{if(editSongId)await db('songs','PATCH','?id=eq.'+encodeURIComponent(id),record);else await db('songs','POST','',{id,...record});editSongId=null})};if($('deleteSong'))$('deleteSong').onclick=()=>{if(!gate()||!confirm('¿Eliminar este canto? Si está en una playlist, Supabase impedirá borrarlo.'))return;guardedSave(async()=>{await db('songs','DELETE','?id=eq.'+encodeURIComponent(editSongId));editSongId=null})}}
function bindSongCards(){document.querySelectorAll('[data-edit-song]').forEach(b=>b.onclick=()=>{editSongId=b.dataset.editSong;render()});document.querySelectorAll('[data-view-song]').forEach(b=>b.onclick=()=>{let s=songs.find(x=>x.id===b.dataset.viewSong);if(!s)return;alert(s.title+' ('+s.key+')\n\n'+s.sections.map(p=>p.type+'\n'+p.chords+'\n'+p.lyrics).join('\n\n'))})}
function bindRemoveSections(){document.querySelectorAll('[data-remove-section]').forEach(b=>b.onclick=()=>{b.closest('[data-section-row]').remove();document.querySelectorAll('[data-section-row]').forEach((x,i)=>x.dataset.sectionRow=i)})}
let draftItems=[];
function bindPlaylists(){if(editPlaylistId===null){if($('newPlaylist'))$('newPlaylist').onclick=()=>{editPlaylistId='';draftItems=[];render()};document.querySelectorAll('[data-editplaylist]').forEach(b=>b.onclick=()=>{editPlaylistId=b.dataset.editplaylist;draftItems=structuredClone(playlists.find(x=>x.id===editPlaylistId).items);render()});document.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>{if(!gate())return;let p=playlists.find(x=>x.id===b.dataset.duplicate);guardedSave(async()=>{const id=uid();await db('setlists','POST','',{id,name:p.name+' (copia)',service_date:p.date,status:'draft',song_ids:p.items.map(x=>x.songId)});if(p.items.length)await db('setlist_songs','POST','',p.items.map((x,i)=>({setlist_id:id,song_id:x.songId,position:i+1,song_key:x.key})))})});return}if(!draftItems.length&&editPlaylistId){draftItems=structuredClone(playlists.find(x=>x.id===editPlaylistId)?.items||[])}$('cancelPlaylist').onclick=()=>{editPlaylistId=null;draftItems=[];render()};$('addPlaylistSong').onclick=()=>{if(!songs.length)return;saveDraftKeys();draftItems.push({songId:songs[0].id,key:songs[0].key});refreshDraft()};$('savePlaylist').onclick=()=>{if(!gate())return;let name=$('playlistName').value.trim(),date=$('playlistDate').value;if(!name)return alert('Escribe el nombre del evento');if(!date)return alert('Selecciona la fecha del evento');saveDraftKeys();const id=editPlaylistId||uid(),status={'En preparación':'draft','Lista':'ready','Finalizada':'completed'}[$('playlistStatus').value]||'draft',items=structuredClone(draftItems);guardedSave(async()=>{const record={name,service_date:date,status,song_ids:items.map(x=>x.songId)};if(editPlaylistId)await db('setlists','PATCH','?id=eq.'+encodeURIComponent(id),record);else await db('setlists','POST','',{id,...record});await db('setlist_songs','DELETE','?setlist_id=eq.'+encodeURIComponent(id));if(items.length)await db('setlist_songs','POST','',items.map((x,i)=>({setlist_id:id,song_id:x.songId,position:i+1,song_key:x.key})));editPlaylistId=null;draftItems=[]})};if($('deletePlaylist'))$('deletePlaylist').onclick=()=>{if(!gate()||!confirm('¿Eliminar esta playlist?'))return;guardedSave(async()=>{await db('setlists','DELETE','?id=eq.'+encodeURIComponent(editPlaylistId));editPlaylistId=null;draftItems=[]})};bindDraftButtons()}
function saveDraftKeys(){document.querySelectorAll('[data-item-row]').forEach(x=>{let i=+x.dataset.itemRow;if(draftItems[i])draftItems[i].key=x.querySelector('.item-key').value})}
function refreshDraft(){$('playlistItems').innerHTML=playlistItemsHtml(draftItems);bindDraftButtons()}
function bindDraftButtons(){document.querySelectorAll('[data-move-up]').forEach(b=>b.onclick=()=>{saveDraftKeys();let i=+b.dataset.moveUp;[draftItems[i-1],draftItems[i]]=[draftItems[i],draftItems[i-1]];refreshDraft()});document.querySelectorAll('[data-move-down]').forEach(b=>b.onclick=()=>{saveDraftKeys();let i=+b.dataset.moveDown;[draftItems[i+1],draftItems[i]]=[draftItems[i],draftItems[i+1]];refreshDraft()});document.querySelectorAll('[data-remove-item]').forEach(b=>b.onclick=()=>{saveDraftKeys();draftItems.splice(+b.dataset.removeItem,1);refreshDraft()});document.querySelectorAll('.item-song').forEach(x=>{let selector=document.createElement('select');selector.style='background:#101b2b;color:white;padding:6px;border-radius:6px;max-width:100%';selector.className='item-song-select';selector.innerHTML=songs.map(s=>`<option value="${esc(s.id)}" ${s.id===x.value?'selected':''}>${esc(s.title)}</option>`).join('');x.replaceWith(selector);selector.onchange=()=>{saveDraftKeys();draftItems[+selector.closest('[data-item-row]').dataset.itemRow].songId=selector.value;refreshDraft()}})}
function bindStage(){$('stagePlaylist').onchange=e=>{activePlaylist=e.target.value;let p=playlists.find(x=>x.id===activePlaylist);activeSong=p?.items[0]?.songId||null;stageKey=p?.items[0]?.key||'G';activeSection=0;persist();render()};$('stageSong').onchange=e=>{activeSong=e.target.value;let p=playlists.find(x=>x.id===activePlaylist);stageKey=p?.items.find(x=>x.songId===activeSong)?.key||'G';activeSection=0;persist();render()};$('stageKey').onchange=e=>{stageKey=e.target.value;render()};document.querySelectorAll('[data-stage-section]').forEach(b=>b.onclick=()=>{if(!canEdit())return alert('Solo el líder puede seleccionar secciones.');activeSection=+b.dataset.stageSection;render()});if($('prevSection'))$('prevSection').onclick=()=>{if(!gate())return;activeSection=Math.max(0,activeSection-1);render()};if($('nextSection'))$('nextSection').onclick=()=>{if(!gate())return;activeSection++;render()};if($('toggleLeader'))$('toggleLeader').onclick=()=>{leaderMode=!leaderMode;render()}}
function sendChat(){let input=$('chatInput'),text=input.value.trim();if(!text)return;chat.push({name:session.user.email,text,time:new Date().toLocaleTimeString('es-US',{hour:'2-digit',minute:'2-digit'})});persist();render();$('chatlog').scrollTop=$('chatlog').scrollHeight}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutTop').onclick=logout;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));restore();
</script></body></html>
